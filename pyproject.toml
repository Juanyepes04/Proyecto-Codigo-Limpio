[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project]
name = "RentaCar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=9.0.2",
    "radon>=6.0.1",
    "requests>=2.32.5",
    "ruff>=0.15.4",
    "streamlit>=1.58.0",
    "supabase>=2.30.1",
    "uvicorn>=0.47.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
